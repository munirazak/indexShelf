services:
  postgres:
    image: postgres:16-alpine
    container_name: indexShelf-db
    environment:
      POSTGRES_DB: book_catalogue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - indexShelf_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d book_catalogue"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indexShelf-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: indexShelf-jwt-secret-key-32chars-min
      JWT_EXPIRATION_MS: "3600000"
      BOOKMANAGEMENT_BASE_URL: http://host.docker.internal:8081
      USERMANAGEMENT_BASE_URL: http://host.docker.internal:8082

volumes:
  indexShelf_pg_data:

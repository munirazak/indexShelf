server.port=8080
spring.application.name=indexShelf
spring.profiles.active=dev

app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-at-least-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

bookmanagement.base-url=${BOOKMANAGEMENT_BASE_URL:http://localhost:8081}
usermanagement.base-url=${USERMANAGEMENT_BASE_URL:http://localhost:8082}

logging.level.root=INFO
logging.level.com.kopibru=INFO
